name: Publish Template

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Optional SemVer version, for example 1.2.0 or 1.2.0-oidc.1.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip
  PACKAGE_PROJECT: ./Atya.Templates.NuGetPackage.csproj

jobs:
  publish:
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          git fetch --tags --force

          $requestedVersion = '${{ inputs.version }}'
          $currentTag = git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | Select-Object -First 1

          if (-not [string]::IsNullOrWhiteSpace($requestedVersion)) {
            if ($requestedVersion -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$') {
              throw "Version must use SemVer format: MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-prerelease."
            }

            $version = $requestedVersion
          } elseif (-not [string]::IsNullOrWhiteSpace($currentTag)) {
            $version = $currentTag.TrimStart('v')
          } else {
            $latestTag = git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | Select-Object -First 1

            if ([string]::IsNullOrWhiteSpace($latestTag)) {
              $version = '1.0.0'
            } else {
              $match = [regex]::Match($latestTag, '^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$')

              if (-not $match.Success) {
                throw "Invalid version tag '$latestTag'. Expected vMAJOR.MINOR.PATCH."
              }

              $major = [int]$match.Groups['major'].Value
              $minor = [int]$match.Groups['minor'].Value
              $patch = [int]$match.Groups['patch'].Value + 1
              $version = "$major.$minor.$patch"
            }
          }

          $tag = "v$version"
          $existingTag = git tag --list $tag

          if (-not [string]::IsNullOrWhiteSpace($existingTag)) {
            $tagCommit = git rev-list -n 1 $tag
            $headCommit = git rev-parse HEAD

            if ($tagCommit -ne $headCommit) {
              throw "Tag $tag already exists on another commit."
            }

            $createTag = 'false'
          } else {
            $createTag = 'true'
          }

          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_VERSION=$version"
          Add-Content -Path $env:GITHUB_ENV -Value "MINVERVERSIONOVERRIDE=$version"
          Add-Content -Path $env:GITHUB_ENV -Value "CREATE_VERSION_TAG=$createTag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

          Write-Host "Template package version: $version"

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0
        with:
          global-json-file: global.json

      - name: Smoke test
        run: pwsh ./template-smoke-test.ps1

      - name: Restore template package
        shell: pwsh
        run: dotnet restore "$env:PACKAGE_PROJECT" --verbosity minimal --locked-mode -p:RestoreLockedMode=true

      - name: Pack template
        shell: pwsh
        run: >
          dotnet pack "$env:PACKAGE_PROJECT"
          --configuration Release
          --no-restore
          --output ./artifacts/packages
          "-p:PackageVersion=$env:PACKAGE_VERSION"
          "-p:Version=$env:PACKAGE_VERSION"
          "-p:MinVerVersionOverride=$env:PACKAGE_VERSION"

      - name: Verify template package
        shell: pwsh
        run: |
          $expectedName = "Atya.Templates.NuGetPackage.$env:PACKAGE_VERSION.nupkg"
          $packages = Get-ChildItem -Path ./artifacts/packages -Filter $expectedName

          if ($packages.Count -ne 1) {
            throw "Expected exactly one package named $expectedName, found $($packages.Count)."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $extractPath = Join-Path $env:RUNNER_TEMP "template-package-nuspec"
          if (Test-Path $extractPath) {
            Remove-Item -Recurse -Force $extractPath
          }

          [System.IO.Compression.ZipFile]::ExtractToDirectory($packages[0].FullName, $extractPath)
          $nuspec = Get-ChildItem -Path $extractPath -Filter "*.nuspec" | Select-Object -First 1

          if (-not $nuspec) {
            throw "No .nuspec found inside $expectedName."
          }

          if (-not (Select-String -Path $nuspec.FullName -Pattern '<packageType name="Template"' -Quiet)) {
            throw "$expectedName does not declare PackageType=Template."
          }

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/packages/sbom.cdx.json

      - name: Sign template package
        env:
          NUGET_SIGN_CERT_BASE64: ${{ secrets.NUGET_SIGN_CERT_BASE64 }}
          NUGET_SIGN_CERT_PASSWORD: ${{ secrets.NUGET_SIGN_CERT_PASSWORD }}
          REQUIRE_SIGNED_PACKAGES: ${{ vars.REQUIRE_SIGNED_PACKAGES || 'true' }}
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path ./artifacts/packages -Filter "*.nupkg")
          if ($packages.Count -ne 1) {
            throw "Expected exactly one template package, found $($packages.Count)."
          }

          $hasSigningSecrets = -not [string]::IsNullOrWhiteSpace($env:NUGET_SIGN_CERT_BASE64) -and
            -not [string]::IsNullOrWhiteSpace($env:NUGET_SIGN_CERT_PASSWORD)

          if ($hasSigningSecrets) {
            $certPath = Join-Path $env:RUNNER_TEMP "nuget-signing-cert.pfx"

            try {
              [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:NUGET_SIGN_CERT_BASE64))

              foreach ($package in $packages) {
                dotnet nuget sign "$($package.FullName)" `
                  --certificate-path "$certPath" `
                  --certificate-password "$env:NUGET_SIGN_CERT_PASSWORD" `
                  --timestamper http://timestamp.digicert.com `
                  --overwrite

                if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
                }
              }
            } finally {
              if (Test-Path -LiteralPath $certPath) {
                Remove-Item -LiteralPath $certPath -Force
              }
            }
          } else {
            if ($env:REQUIRE_SIGNED_PACKAGES -eq 'true') {
              throw "Package signing is required, but NUGET_SIGN_CERT_BASE64 and NUGET_SIGN_CERT_PASSWORD are not both set."
            }

            Write-Warning "Package signing was explicitly disabled; publishing an unsigned package."
          }

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: template-package-${{ steps.version.outputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/sbom.cdx.json
          if-no-files-found: error

      - name: Attest package provenance
        continue-on-error: ${{ github.event.repository.visibility != 'public' }}
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: artifacts/packages/*.nupkg

      - name: Log in to NuGet.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ArsenAsulyan

      - name: Publish to nuget.org
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path ./artifacts/packages -Filter "*.nupkg")
          if ($packages.Count -ne 1) {
            throw "Expected exactly one template package, found $($packages.Count)."
          }

          dotnet nuget push "$($packages[0].FullName)" `
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Create version tag
        if: env.CREATE_VERSION_TAG == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$env:PACKAGE_VERSION"
          git push origin "v$env:PACKAGE_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/sbom.cdx.json
