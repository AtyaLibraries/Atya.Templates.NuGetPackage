name: CI

on:
  push:
    branches: [development, master]
  pull_request:
    branches: [development, master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  ci:
    uses: AtyaLibraries/github-workflows/.github/workflows/dotnet-package-ci.yml@v1
    with:
      solution: ./NuGetPackage.sln
      test-project: ./tests/NuGetPackage.UnitTests/NuGetPackage.UnitTests.csproj
      package-project: ./src/NuGetPackage/NuGetPackage.csproj
      allow-empty-coverage: true # scaffold has no covered code yet; set false once you add some

  build-ubuntu-latest:
    name: build-ubuntu-latest
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - run: echo "Reusable CI completed."

  build-windows-latest:
    name: build-windows-latest
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - run: echo "Reusable CI completed."
