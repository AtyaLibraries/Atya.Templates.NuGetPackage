name: Publish NuGet

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: Optional stable SemVer version, for example 1.2.0.
        required: false
        type: string

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  publish:
    uses: AtyaLibraries/github-workflows/.github/workflows/publish-nuget.yml@v1
    secrets: inherit
    with:
      solution: ./NuGetPackage.sln
      test-project: ./tests/NuGetPackage.UnitTests/NuGetPackage.UnitTests.csproj
      package-project: ./src/NuGetPackage/NuGetPackage.csproj
      version: ${{ inputs.version || '' }}
